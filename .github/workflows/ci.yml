name: CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.preset }} / ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        preset: [debug, release, asan, tsan]
        compiler: [gcc, clang]
        include:
          - compiler: gcc
            cc: gcc-14
            cxx: g++-14
          - compiler: clang
            cc: clang-18
            cxx: clang++-18

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      # Ubuntu 24.04 runners use high ASLR entropy, which makes ThreadSanitizer
      # abort with "unexpected memory mapping". Lowering it is the standard workaround.
      - name: Lower ASLR entropy for TSan
        if: matrix.preset == 'tsan'
        run: sudo sysctl vm.mmap_rnd_bits=28

      - name: Configure
        run: >
          cmake --preset ${{ matrix.preset }}
          -DCMAKE_C_COMPILER=${{ matrix.cc }}
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}

      - name: Build
        run: cmake --build --preset ${{ matrix.preset }}

      - name: Test
        run: ctest --preset ${{ matrix.preset }}

  # Short libFuzzer runs of every fuzz target (the books, the protocol codec, the session
  # layer, the market data feed, the journal and its snapshots, see fuzz/CMakeLists.txt).
  # The saved inputs also run in every job above as the *FuzzCorpusReplay tests. This job
  # searches for new failing inputs.
  fuzz:
    name: fuzz / clang
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: sudo apt-get update && sudo apt-get install -y ninja-build libclang-rt-18-dev

      - name: Configure
        run: cmake --preset fuzz -DCMAKE_C_COMPILER=clang-18 -DCMAKE_CXX_COMPILER=clang++-18

      - name: Build
        run: cmake --build --preset fuzz

      - name: Fuzz for 60 seconds
        run: |
          mkdir -p corpus artifacts
          ./build/fuzz/fuzz/book_fuzzer -max_total_time=60 -max_len=1024 -timeout=10 \
            -artifact_prefix=artifacts/ corpus fuzz/seeds

      - name: Fuzz the protocol codec for 60 seconds
        run: |
          mkdir -p protocol_corpus artifacts
          ./build/fuzz/fuzz/protocol_fuzzer -max_total_time=60 -max_len=128 -timeout=10 \
            -artifact_prefix=artifacts/protocol- protocol_corpus fuzz/protocol_seeds

      - name: Fuzz the session layer for 60 seconds
        run: |
          mkdir -p session_corpus artifacts
          ./build/fuzz/fuzz/session_fuzzer -max_total_time=60 -max_len=4096 -timeout=10 \
            -artifact_prefix=artifacts/session- session_corpus fuzz/session_seeds

      - name: Fuzz the market data feed for 60 seconds
        run: |
          mkdir -p feed_corpus artifacts
          ./build/fuzz/fuzz/feed_fuzzer -max_total_time=60 -max_len=4096 -timeout=10 \
            -artifact_prefix=artifacts/feed- feed_corpus fuzz/feed_seeds

      - name: Fuzz the journal for 60 seconds
        run: |
          mkdir -p journal_corpus artifacts
          ./build/fuzz/fuzz/journal_fuzzer -max_total_time=60 -max_len=4096 -timeout=10 \
            -artifact_prefix=artifacts/journal- journal_corpus fuzz/journal_seeds

      - name: Fuzz the journal snapshots for 60 seconds
        run: |
          mkdir -p snapshot_corpus artifacts
          ./build/fuzz/fuzz/snapshot_fuzzer -max_total_time=60 -max_len=8192 -timeout=10 \
            -artifact_prefix=artifacts/snapshot- snapshot_corpus fuzz/snapshot_seeds

      - name: Upload failing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: artifacts/
